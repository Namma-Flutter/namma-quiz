class: GameSession
table: game_sessions
fields:
  pin: String
  quizId: int
  hostId: int
  status: String # 'lobby', 'active', 'paused', 'finished'
  currentQuestionIndex: int
  startTime: DateTime?
  hostTokenHash: String?, scope=serverOnly # SHA-256 of the host's secret token
indexes:
  game_session_pin_idx:
    fields: pin
    unique: true
